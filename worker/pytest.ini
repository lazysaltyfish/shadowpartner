[pytest]
# Pytest configuration for worker tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Show summary of all test outcomes
    -ra
    # Strict markers
    --strict-markers
    # Show extra test summary info
    --tb=short
    # Enable async mode (auto for pytest-asyncio)
    -p asyncio

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    gpu: marks tests that require GPU (skip with '-m "not gpu"')
    network: marks tests that require network access
    whisper: marks tests that use actual Whisper model

# Asyncio configuration
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options (when using pytest-cov)
# addopts = --cov=. --cov-report=html --cov-report=term

# Warning handling
filterwarnings =
    # Ignore specific warnings during tests
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
