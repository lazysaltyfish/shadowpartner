[project]
name = "shadowpartner-worker"
version = "0.1.0"
description = "ShadowPartner Whisper GPU worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "ffmpeg-python>=0.2.0",
    "mecab-python3>=1.0.12",
    "openai-whisper>=20231117",
    "python-dotenv>=1.0.0",
    "unidic-lite>=1.0.8",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.11",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
